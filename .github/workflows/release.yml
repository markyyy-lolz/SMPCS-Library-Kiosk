name: Build Windows EXE and publish release
on:
  push:
    branches: [main, feature/library-suite, feature/library-operations]
    paths:
      - 'shared/updates.py'
      - 'shared/installer.py'
      - 'tests/**'
      - 'migrations/**'
      - 'scripts/test*database.py'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: smpcs-release
  cancel-in-progress: false
jobs:
  database-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: library_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'psycopg[binary]>=3,<4'
      - name: Verify database permissions and workflows
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/library_test
        run: |
          python scripts/test_database.py
          python scripts/test_suite_database.py
          python scripts/test_operations_database.py
  release:
    needs: database-tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check source and update logic
        run: |
          python -m compileall -q admin kiosk shared launch.pyw scripts
          python -m unittest discover -s tests -v
      - name: Package source release
        run: python scripts/package_release.py
      - name: Build and test Windows executable
        run: python scripts/build_windows.py
      - name: Test real EXE update and rollback primitives
        run: python scripts/test_windows_update.py
      - name: Scan release with Microsoft Defender when available
        shell: pwsh
        run: ./scripts/scan_release.ps1
      - name: Record dependencies and checksums
        shell: pwsh
        run: |
          python -m pip freeze | Out-File -Encoding utf8 dist/BUILD_DEPENDENCIES.txt
          python scripts/release_notes.py
          python scripts/release_checksums.py
      - name: Save tested Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SMPCS-Library-tested-build
          path: |
            dist/SMPCS_Library_Windows_*.zip
            dist/SMPCS_Library_v*.zip
            dist/003_library_suite.sql
            dist/SHA256SUMS.txt
            dist/SCAN_REPORT.txt
          retention-days: 14
      - name: Publish new version
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "from shared.updates import VERSION; print(VERSION)")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; nothing overwritten."
            exit 0
          fi
          gh release create "v$VERSION" "dist/SMPCS_Library_Windows_v$VERSION.zip" "dist/SMPCS_Library_v$VERSION.zip" dist/SHA256SUMS.txt dist/SCAN_REPORT.txt dist/BUILD_DEPENDENCIES.txt dist/002_accounts_services.sql dist/003_library_suite.sql dist/Open_Updates.vbs \
            --target "$GITHUB_SHA" --title "SMPCS Library v$VERSION — Windows EXE" \
            --notes-file dist/RELEASE_NOTES.md
